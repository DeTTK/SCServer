name: Source checks
on:
  push:
    branches-ignore: ['build-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: python scripts/audit_public.py
      - run: python -m unittest discover -s scripts/tests
      - run: python scripts/build.py test
      - run: python client-compat/character-scale/build.py
      - if: runner.os == 'Windows'
        run: python scripts/build.py desktop
  native-launcher:
    runs-on: windows-2022
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install supported Rust stable
        run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            launcher/target
          key: native-launcher-${{ runner.os }}-${{ hashFiles('launcher/Cargo.lock') }}
      - run: cargo +stable test --manifest-path launcher/Cargo.toml --workspace --locked -j 4
      - run: cargo +stable build --manifest-path launcher/Cargo.toml --bin BSCPCRAFT --locked -j 4
      - run: ./launcher/tests/single-exe.ps1 -Executable ./launcher/target/debug/BSCPCRAFT.exe
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: ./launcher/modules/bridge/test.ps1
