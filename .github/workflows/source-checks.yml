name: Source checks
on:
  push:
    branches-ignore: ['build-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: python scripts/audit_public.py
      - run: python -m unittest discover -s scripts/tests
      - run: python scripts/build.py test
      - run: python client-compat/character-scale/build.py
      - if: runner.os == 'Windows'
        run: python scripts/build.py desktop
