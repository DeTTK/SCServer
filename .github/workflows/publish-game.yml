name: Publish game delivery
on:
  workflow_call:
    secrets:
      LAUNTEST_DELIVERY_PRIVATE_KEY:
        required: true
permissions:
  contents: read
concurrency:
  group: game-delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test' || github.ref == 'refs/heads/launtest'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v5
        with:
          path: |
            .local/deps
            .local/delivery-inputs
          key: delivery-inputs-${{ hashFiles('bootstrap/base.lock.json', 'bootstrap/input-manifest.json', 'dependencies.lock.json') }}
      - run: python scripts/delivery.py prepare
      - name: Publish only successful current source
        run: python scripts/delivery.py publish
        env:
          DELIVERY_PRIVATE_KEY: ${{ secrets.LAUNTEST_DELIVERY_PRIVATE_KEY }}
