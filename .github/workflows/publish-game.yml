name: Publish launtest game
on:
  push:
    branches: [launtest]
    paths-ignore: ['docs/**', '**/*.md', 'validation-*.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    if: github.ref == 'refs/heads/launtest'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v5
        with:
          path: |
            .local/deps
            .local/delivery-inputs
          key: delivery-inputs-${{ hashFiles('bootstrap/base.lock.json', 'dependencies.lock.json') }}
      - run: python scripts/audit_public.py
      - run: python -m unittest discover -s scripts/tests
      - run: python scripts/build.py test
      - run: python scripts/delivery.py prepare
      - name: Publish only successful current source
        run: python scripts/delivery.py publish
        env:
          DELIVERY_PRIVATE_KEY: ${{ secrets.LAUNTEST_DELIVERY_PRIVATE_KEY }}
