name: Prepare and label player reports
on:
  push:
    branches: [launtest]
    paths: ['.github/workflows/player-reports.yml', '.github/ISSUE_TEMPLATE/player-report.yml']
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  labels:
    if: github.event_name != 'issues' || contains(github.event.issue.body, '<!-- bscp-player-report:v1 -->')
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure report label and apply it to marked issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          repository = os.environ['REPOSITORY']
          def post(path, data):
              request = urllib.request.Request('https://api.github.com/repos/' + repository + path,
                  data=json.dumps(data).encode(), method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28'})
              return urllib.request.urlopen(request, timeout=20)
          try:
              post('/labels', {'name':'player-report','color':'8b8b94','description':'Bug report submitted by a BSCPCRAFT player'}).close()
          except urllib.error.HTTPError as error:
              if error.code != 422: raise
          number = os.environ.get('ISSUE_NUMBER', '')
          if number:
              if not number.isdecimal(): raise SystemExit('Invalid issue number')
              post('/issues/' + number + '/labels', {'labels':['player-report']}).close()
          print('player-report label ready')
          PY

